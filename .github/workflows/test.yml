name: test

#触发条件
on:
  push:
    branches: [main] # push 到 main 时触发
  workflow_dispatch: # 允许在网页上手动点按钮跑

#权限声明
permissions:
  contents: read
  pages: write
  id-token: write

#任务本体
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 启动被测服务
        run: |
          python app.py &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/todos > /dev/null; then
              echo "服务已就绪（等了 ${i} 秒）"
              exit 0
            fi
            sleep 1
          done
          echo "服务在 30 秒内未就绪"
          exit 1

      - name: 运行测试
        run: pytest -q --alluredir=./allure-results --clean-alluredir

      - name: 安装 Allure CLI
        if: always()
        run: |
          curl -sL -o /tmp/allure.tgz https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          sudo tar -xzf /tmp/allure.tgz -C /opt
          sudo ln -sf /opt/allure-2.29.0/bin/allure /usr/local/bin/allure
          allure --version

      - name: 生成 HTML 报告
        if: always()
        run: allure generate ./allure-results -o ./allure-report --clean

      - name: 上传 Pages 产物
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./allure-report

  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
