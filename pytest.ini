#pytest配置文件
#pytest.ini 里的注释必须单独占一行，不能写在配置值后面
[pytest]

#pytest中中文默认转成ASCLL，加了下面语句，则可显示成中文
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

#pytest 的日志配置，只影响控制台实时输出，不影响写入文件的日志。

#开启实时日志输出。设为 True 后，测试执行过程中，通过 logging 记录的日志会实时打印到终端。
log_cli = True
 #设置控制台实时日志的最低级别。级别大小关系：DEBUG < INFO < WARNING < ERROR
log_cli_level = INFO
#定义每条日志的显示格式
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
#定义 %(asctime)s 的时间格式
log_cli_date_format = %H:%M:%S